# SAE V3.3-compatible Lean Lab example. Replace placeholders and pin an immutable framework SHA.
# This is a configuration template, not proof that any runner/Publisher exists.
sae_version: "3.3"
project:
  repository: "<OWNER>/<PROJECT>"
  name: "<PROJECT>"
  package: "<PACKAGE_NAME>"
  scientific_goal: "<ALGORITHM_AND_PROBLEM>"
framework:
  repository: "JohnnyZPiggy/SAE-Framework"
  commit_sha: "<ACTUAL_40_CHARACTER_SHA>"
  local_snapshot: ".sae"
roles:
  scientist: "human"
  architect: "gpt"
  mentor: "gpt"
  engineer: "codex"
objectives:
  engineering_productivity: true
  scientific_learning: true
research_gate:
  required_before_formal_acceptance: true
  decision_role: "gpt"
  study_path_template: "docs/research/<algorithm>-tensorization.md"
  scientist_review_required: false
  outcome_values: ["RESEARCH_READY", "RESEARCH_BLOCKED", "NOT_TENSORIZABLE"]
  speedup_claims_require_real_measurement: true
collaboration:
  task_hub: "github_issues"
  review_hub: "github_pull_requests"
  actions_enabled: false
  hosted_ci_required: false
  merge_decision_role: "gpt_architect"
  merge_requires_architect_evidence_review: true
  per_pr_scientist_approval_required: false
experiments:
  device_runner: "codex_local_and_colab_cli"
  devices: ["cpu", "gpu", "tpu"]
  gpu_tpu_require_scientist_budget_approval: false
  new_billing_requires_explicit_user_approval: true
  max_active_colab_sessions: 1
  task_timeout_required: true
  notebook_style: "optional_thin_workspace"
  execution_stages: ["pinned_install", "benchmark", "optional_publish"]
  install_source: "pinned_github_commit_via_pip"
  benchmark_cli: "python -m <PACKAGE_NAME>.benchmarks.run --device <DEVICE>"
  benchmark_in_pip_package: true
  publisher_invoked_inside_benchmark_cli: false
  publisher: "optional_separate_cli_unverified_until_tested"
  reports_in_github: true
  google_drive_role: "temporary_notebook_workspace_only"
  drive_sync: false
  publish_branch_prefix: "experiment/"
workflow:
  default_mode: "EXPLORE"
  supported_modes: ["EXPLORE", "VALIDATE"]
  validate_requires_real_numerical_evidence: true
  experiment_batch:
    one_issue_per_batch: true
    max_self_repair_attempts_per_failure_class: 3
    one_concise_evidence_summary_per_batch: true
    additional_per_attempt_scientist_or_gpt_signoff: false
    protocol: ".sae/workflows/LEAN_RESEARCH_LAB.md"
