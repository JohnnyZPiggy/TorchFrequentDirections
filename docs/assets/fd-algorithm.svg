<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Buffered Fast Frequent Directions: sequential state and nonmutating snapshots</title><desc id="desc">Rows fill a 2ell buffer. A full buffer is factored, shrunk at sigma ell, cleared and reduced to min(ell-1,d) rows before appending more. Short snapshots copy; long snapshots shrink without changing state.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="28" y="40" font-size="26" fill="#0f172a" >Fast FD: one sequential state, two snapshot paths</text>
<text x="28" y="69" font-size="16" fill="#475569" >Dense finite real rows; ell &gt;= 1; reduced Direct SVD; inference only</text>
<rect x="28" y="112" width="150" height="112" rx="10" fill="#fff" stroke="#94a3b8"/>
<text x="43" y="140" font-size="18" fill="#0f172a" >Rows arrive</text>
<text x="43" y="167" font-size="15" fill="#334155" >Preserve order</text>
<text x="43" y="189" font-size="15" fill="#334155" >Validate chunk</text>
<rect x="224" y="112" width="205" height="112" rx="10" fill="#fff" stroke="#94a3b8"/>
<text x="239" y="140" font-size="18" fill="#0f172a" >Fill occupied prefix</text>
<text x="239" y="167" font-size="15" fill="#334155" >Capacity: 2ell x d</text>
<text x="239" y="189" font-size="15" fill="#334155" >Track m explicitly</text>
<rect x="478" y="112" width="180" height="112" rx="10" fill="#fff" stroke="#94a3b8"/>
<text x="493" y="140" font-size="18" fill="#0f172a" >Full: m = 2ell</text>
<text x="493" y="167" font-size="15" fill="#334155" >C = U diag(s) Vh</text>
<text x="493" y="189" font-size="15" fill="#334155" >Reduced SVD</text>
<rect x="704" y="112" width="268" height="112" rx="10" fill="#fff" stroke="#94a3b8"/>
<text x="719" y="140" font-size="18" fill="#0f172a" >Threshold + shrink</text>
<text x="719" y="167" font-size="15" fill="#334155" >delta = sigma_ell^2</text>
<text x="719" y="189" font-size="15" fill="#334155" >w = sqrt(max(s^2 - delta, 0))</text>
<path d="M178,167 H224" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M429,167 H478" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M658,167 H704" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="478" y="274" width="494" height="100" rx="10" fill="#fff" stroke="#94a3b8"/>
<text x="493" y="302" font-size="18" fill="#0f172a" >Retain q = min(ell - 1, d) directions</text>
<text x="493" y="329" font-size="15" fill="#334155" >Zero the physical buffer, copy (w * Vh)[:q], then append.</text>
<path d="M839,224 V274" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M478,324 H328 V224" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="290" font-size="16" fill="#0f766e" >Continue on the SAME state</text>
<text x="28" y="407" font-size="20" fill="#0f172a" >Observe sketch(): independent ell x d output; no state mutation</text>
<rect x="28" y="432" width="420" height="106" rx="10" fill="#fff" stroke="#94a3b8"/>
<text x="43" y="460" font-size="18" fill="#0f172a" >0 &lt;= m &lt;= ell</text>
<text x="43" y="487" font-size="15" fill="#334155" >Copy C = buffer[:m], then pad zeros.</text>
<text x="43" y="509" font-size="15" fill="#334155" >No SVD; B^T B = C^T C; rank may equal ell.</text>
<rect x="478" y="432" width="494" height="106" rx="10" fill="#fff" stroke="#94a3b8"/>
<text x="493" y="460" font-size="18" fill="#0f172a" >ell &lt; m &lt; 2ell</text>
<text x="493" y="487" font-size="15" fill="#334155" >Factor the occupied prefix and apply the SAME shrink.</text>
<text x="493" y="509" font-size="15" fill="#334155" >Never truncate pending rows to ell without shrink.</text>
<text x="28" y="574" font-size="15" fill="#0f172a" >If ell &gt; min(m,d), the missing threshold is zero: an exact-covariance extension.</text>
<text x="28" y="599" font-size="15" fill="#0f172a" >Code normalizes before squaring to limit overflow. For PCA, decompose B for its right subspace.</text>
<text x="28" y="627" font-size="13" fill="#475569" >Source: torchfrequentdirections/fd.py at documentation base f97070d; mathematical diagram, not timings.</text>
</g></svg>
